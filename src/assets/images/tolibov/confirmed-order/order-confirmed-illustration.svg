<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="successBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="checkShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Backdrop -->
  <circle cx="200" cy="140" r="110" fill="url(#successBg)"/>

  <!-- Confetti Elements -->
  <rect x="90" y="70" width="12" height="6" rx="2" fill="#8A33FD" transform="rotate(25 90 70)"/>
  <rect x="300" y="75" width="10" height="5" rx="2" fill="#EC4899" transform="rotate(-35 300 75)"/>
  <rect x="110" y="180" width="10" height="5" rx="2" fill="#F59E0B" transform="rotate(40 110 180)"/>
  <rect x="290" y="185" width="12" height="6" rx="2" fill="#10B981" transform="rotate(-20 290 185)"/>
  <circle cx="85" cy="120" r="4" fill="#3B82F6"/>
  <circle cx="315" cy="130" r="5" fill="#F59E0B"/>

  <!-- Shopping Bag with Checkmark -->
  <g filter="url(#checkShadow)" transform="translate(145, 65)">
    <!-- Bag handles -->
    <path d="M35 35 C35 15 75 15 75 35" fill="none" stroke="#8A33FD" stroke-width="4" stroke-linecap="round"/>
    <!-- Bag body -->
    <path d="M15 35 L95 35 L90 120 L20 120 Z" fill="#8A33FD"/>
    <path d="M15 35 L20 120 L28 120 L22 35 Z" fill="#6610F2" opacity="0.6"/>

    <!-- Glowing Green Circle with Checkmark -->
    <circle cx="55" cy="80" r="28" fill="url(#checkGrad)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M43 80 L51 88 L67 72" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Order Confirmed Badge -->
  <rect x="100" y="240" width="200" height="32" rx="16" fill="#F6F6F6" stroke="#E6E6E6" stroke-width="1.5"/>
  <text x="200" y="261" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">Order Placed Successfully!</text>
</svg>