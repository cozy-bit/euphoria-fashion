<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad404" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A33FD"/>
      <stop offset="100%" stop-color="#6610F2"/>
    </linearGradient>
    <linearGradient id="softBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4ECFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8A33FD" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Glow & Shapes -->
  <circle cx="200" cy="150" r="120" fill="url(#softBg)"/>
  <circle cx="90" cy="70" r="6" fill="#EC4899" opacity="0.6"/>
  <circle cx="310" cy="80" r="8" fill="#F59E0B" opacity="0.6"/>
  <circle cx="330" cy="220" r="5" fill="#8A33FD" opacity="0.4"/>
  <path d="M70 190 L85 195 L75 205 Z" fill="#8A33FD" opacity="0.3"/>
  <path d="M300 140 L312 145 L305 155 Z" fill="#EC4899" opacity="0.4"/>

  <!-- Large 404 Typography -->
  <g filter="url(#shadow)">
    <text x="200" y="165" font-family="'Montserrat', sans-serif" font-size="110" font-weight="900" text-anchor="middle" fill="url(#grad404)" letter-spacing="4">404</text>
  </g>

  <!-- Illustration Elements: Telescope & Searching -->
  <g transform="translate(160, 160)">
    <!-- Base stand -->
    <path d="M40 50 L20 110 M40 50 L60 110 M40 50 L40 110" stroke="#3C4242" stroke-width="3" stroke-linecap="round"/>
    <!-- Telescope tube -->
    <rect x="15" y="32" width="60" height="18" rx="4" transform="rotate(-30 40 40)" fill="#8A33FD"/>
    <rect x="65" y="27" width="16" height="24" rx="3" transform="rotate(-30 40 40)" fill="#F59E0B"/>
    <circle cx="20" cy="53" r="5" fill="#3C4242"/>
    <!-- Lens gleam -->
    <path d="M80 18 L95 10" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M88 28 L104 26" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Subtitle Ribbon -->
  <rect x="110" y="235" width="180" height="32" rx="16" fill="#F6F6F6" stroke="#E6E6E6" stroke-width="1.5"/>
  <text x="200" y="256" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#3C4242" text-anchor="middle">Oops! Page not found</text>
</svg>