<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cartBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="cartShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Circular Backdrop -->
  <circle cx="200" cy="140" r="110" fill="url(#cartBg)"/>

  <!-- Sparkles & Floats -->
  <circle cx="100" cy="80" r="5" fill="#8A33FD" opacity="0.5"/>
  <circle cx="300" cy="90" r="7" fill="#F59E0B" opacity="0.6"/>
  <circle cx="85" cy="180" r="4" fill="#EC4899" opacity="0.4"/>
  <circle cx="315" cy="190" r="6" fill="#10B981" opacity="0.5"/>

  <!-- Cardboard Box Body -->
  <g filter="url(#cartShadow)" transform="translate(130, 80)">
    <!-- Box base -->
    <path d="M15 55 L70 85 L125 55 L70 25 Z" fill="#FDE68A"/>
    <path d="M15 55 L70 85 L70 145 L15 115 Z" fill="url(#boxGrad)"/>
    <path d="M70 85 L125 55 L125 115 L70 145 Z" fill="#D97706"/>

    <!-- Open flaps -->
    <path d="M15 55 L3 25 L50 2 Z" fill="#F59E0B" opacity="0.8"/>
    <path d="M125 55 L137 25 L90 2 Z" fill="#B45309" opacity="0.8"/>
    <path d="M70 85 L60 120 L80 120 Z" fill="#92400E" opacity="0.2"/>

    <!-- Euphoria E Logo on Box -->
    <rect x="35" y="80" width="20" height="24" rx="2" fill="#FFFFFF" opacity="0.85"/>
    <text x="45" y="97" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900" fill="#8A33FD" text-anchor="middle">E</text>

    <!-- Dashed Empty State Orbit -->
    <ellipse cx="70" cy="50" rx="35" ry="16" fill="none" stroke="#8A33FD" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Magnifying Glass Search -->
  <g transform="translate(230, 160)">
    <circle cx="25" cy="25" r="20" fill="#FFFFFF" stroke="#8A33FD" stroke-width="4"/>
    <circle cx="25" cy="25" r="14" fill="#F4ECFF" opacity="0.6"/>
    <path d="M39 39 L55 55" stroke="#3C4242" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Caption Pill -->
  <rect x="110" y="240" width="180" height="32" rx="16" fill="#F6F6F6" stroke="#E6E6E6" stroke-width="1.5"/>
  <text x="200" y="261" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#3C4242" text-anchor="middle">Your Cart is Empty</text>
</svg>